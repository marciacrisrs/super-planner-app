name: Generate PR dependency locks

on:
  push:
    branches:
      - fix/ai-confirmation-boundary

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v6
      - name: Generate lockfiles
        run: |
          chmod +x gradlew
          ./gradlew resolveAndLockAll --write-locks --stacktrace --no-daemon
      - name: Commit generated lockfiles
        run: |
          git add '**/gradle.lockfile' '**/buildscript-gradle.lockfile'
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: generate Gradle dependency locks"
          git push
