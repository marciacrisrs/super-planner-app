name: Fix build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compile fixes
        shell: bash
        run: |
          set -e
          rm -rf app/src/main/java/com/gpsdavida.app app/src/test/java/com/gpsdavida.app || true
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/gpsdavida')
          for p in root.rglob('*.kt'):
              s=p.read_text()
              s=s.replace('goalId?.let(::com.superplanner.app.domain.model.GoalId)', 'goalId?.let(::GoalId)')
              if p.name=='HabitMapper.kt' and 'import com.superplanner.app.domain.model.GoalId' not in s:
                  s=s.replace('import com.superplanner.app.domain.model.HabitId\n', 'import com.superplanner.app.domain.model.HabitId\nimport com.superplanner.app.domain.model.GoalId\n')
              if p.name=='NotesViewModel.kt':
                  s=s.replace('import kotlinx.coroutines.flow.combine\n', 'import kotlinx.coroutines.flow.combine\nimport kotlinx.coroutines.flow.flatMapLatest\n')
                  s=s.replace('        .let { contexts ->\n            kotlinx.coroutines.flow.flatMapLatest(contexts) { (type, id) -> repository.observeNotes(type, id) }\n        }', '        .flatMapLatest { (type, id) -> repository.observeNotes(type, id) }')
              if p.name=='WeekDayViewModel.kt':
                  s=s.replace('    observeWeeklyPlanning: ObserveWeeklyPlanning,', '    private val observeWeeklyPlanning: ObserveWeeklyPlanning,')
              if p.name=='WeekScreen.kt':
                  s=s.replace('import androidx.compose.material.icons.filled.ChevronLeft', 'import androidx.compose.material.icons.filled.ArrowBack')
                  s=s.replace('import androidx.compose.material.icons.filled.ChevronRight', 'import androidx.compose.material.icons.filled.ArrowForward')
                  s=s.replace('Icons.Filled.ChevronLeft', 'Icons.Filled.ArrowBack')
                  s=s.replace('Icons.Filled.ChevronRight', 'Icons.Filled.ArrowForward')
              if p.name=='SuperPlannerNavHost.kt':
                  s=s.replace('import androidx.compose.material.icons.filled.Tune', 'import androidx.compose.material.icons.filled.Settings')
                  s=s.replace('Icons.Filled.Tune', 'Icons.Filled.Settings')
                  s=s.replace('WeekScreen { date -> navController.navigate(SuperPlannerRoutes.weekDay(date)) }', 'WeekScreen(onOpenDay = { date -> navController.navigate(SuperPlannerRoutes.weekDay(date)) })')
                  s=s.replace('EventFormScreen { navController.popBackStack() }', 'EventFormScreen(onDone = { navController.popBackStack() })')
                  s=s.replace('TaskFormScreen { navController.popBackStack() }', 'TaskFormScreen(onDone = { navController.popBackStack() })')
                  s=s.replace('HabitFormScreen { navController.popBackStack() }', 'HabitFormScreen(onDone = { navController.popBackStack() })')
                  s=s.replace('RoutineFormScreen { navController.popBackStack() }', 'RoutineFormScreen(onDone = { navController.popBackStack() })')
              if p.name=='HomeScreen.kt':
                  s=s.replace('                            com.superplanner.app.domain.model.NextActionReason.HIGHER_PRIORITY -> stringResource(R.string.reason_higher_priority)\n', '')
              if p.name=='HorizonsViewModel.kt':
                  s=s.replace('(start..end).any { event.occursOn(it, zone) }', 'datesBetween(start, end).any { event.occursOn(it, zone) }')
                  s=s.replace('(start..end).any(habit::occursOn)', 'datesBetween(start, end).any(habit::occursOn)')
                  s=s.replace('(start..end).any { routine.daysOfWeek.isEmpty() || it.dayOfWeek in routine.daysOfWeek }', 'datesBetween(start, end).any { routine.daysOfWeek.isEmpty() || it.dayOfWeek in routine.daysOfWeek }')
                  s=s.replace('(start..end).count { it.dayOfWeek in days }', 'datesBetween(start, end).count { it.dayOfWeek in days }')
                  marker='    private fun daysActive('
                  helper='    private fun datesBetween(start: LocalDate, end: LocalDate): Sequence<LocalDate> = sequence {\n        var date = start\n        while (!date.isAfter(end)) {\n            yield(date)\n            date = date.plusDays(1)\n        }\n    }\n'
                  s=s.replace(marker, helper+'\n'+marker)
              p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/gpsdavida/app/domain/usecase/ObserveWeeklyPlanning.kt')
          s=p.read_text()
          old='''    ): Flow<WeeklyPlanning> = combine(\n        events.observeAll(),\n        tasks.observeAll(),\n        habits.observeAll(),\n        routines.observeAll(),\n        executions.observeAll(),\n        availability.observeAll(),\n    ) { eventList, taskList, habitList, routineList, executionList, availabilityList ->\n        buildWeeklyPlanning(\n            startDate = startDate,\n            zoneId = zoneId,\n            eventList = eventList,\n            taskList = taskList,\n            habitList = habitList,\n            routineList = routineList,\n            executionList = executionList,\n            availabilityList = availabilityList,\n        )\n    }'''
          new='''    ): Flow<WeeklyPlanning> = combine(listOf(\n        events.observeAll(),\n        tasks.observeAll(),\n        habits.observeAll(),\n        routines.observeAll(),\n        executions.observeAll(),\n        availability.observeAll(),\n    )) { values ->\n        buildWeeklyPlanning(\n            startDate = startDate,\n            zoneId = zoneId,\n            eventList = values[0] as List<com.superplanner.app.domain.model.Event>,\n            taskList = values[1] as List<com.superplanner.app.domain.model.Task>,\n            habitList = values[2] as List<com.superplanner.app.domain.model.Habit>,\n            routineList = values[3] as List<com.superplanner.app.domain.model.Routine>,\n            executionList = values[4] as List<ActivityExecution>,\n            availabilityList = values[5] as List<Availability>,\n        )\n    }'''
          if old not in s: raise SystemExit('ObserveWeeklyPlanning block not found')
          s=s.replace(old,new)
          p.write_text(s)
          
          p=Path('app/src/main/java/com/gpsdavida/app/domain/usecase/ChooseNextActivity.kt')
          p.unlink()
          
          p=Path('app/src/main/java/com/gpsdavida/app/ui/contexto/LifeAreaVisuals.kt')
          s=p.read_text()
          for name in ['AccountBalance','Book','BusinessCenter','SelfImprovement','Spa','Weekend']:
              s=s.replace(f'Icons.Filled.{name}', 'Icons.Filled.Home')
          import re
          s=re.sub(r'import androidx\.compose\.material\.icons\.filled\.(AccountBalance|Book|BusinessCenter|SelfImprovement|Spa|Weekend)\n','',s)
          if 'import androidx.compose.material.icons.filled.Home' not in s:
              s=s.replace('import androidx.compose.material.icons.Icons\n','import androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.Home\n')
          p.write_text(s)
          
          p=Path('app/src/main/java/com/gpsdavida/app/ui/navigation/SuperPlannerNavHost.kt')
          s=p.read_text().replace('Icons.Filled.Tune','Icons.Filled.Settings')
          p.write_text(s)
          
          p=Path('app/src/main/java/com/gpsdavida/app/ui/semana/WeekScreen.kt')
          s=p.read_text().replace('Icons.Filled.ChevronLeft','Icons.Filled.ArrowBack').replace('Icons.Filled.ChevronRight','Icons.Filled.ArrowForward')
          p.write_text(s)
          PY
      - name: Validate
        run: chmod +x gradlew && ./gradlew test assembleDebug --stacktrace
      - name: Commit fixes and remove workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-build.yml
          git add -A
          git commit -m 'fix: restore clean Super Planner build' || exit 0
          git push
